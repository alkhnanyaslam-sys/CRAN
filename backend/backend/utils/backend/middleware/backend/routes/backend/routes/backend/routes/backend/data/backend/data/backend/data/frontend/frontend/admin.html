<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم CRWN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- PIN GATE -->
<div class="pin-screen" id="pin-screen">
  <div class="pin-box">
    <h3>👑 لوحة تحكم CRWN</h3>
    <input id="pin-input" type="password" maxlength="6" placeholder="••••">
    <div class="pin-error" id="pin-error"></div>
    <button class="checkout-btn" onclick="checkPin()">دخول</button>
    <div style="margin-top:14px;"><a href="index.html" class="admin-link">رجوع للموقع</a></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="admin-wrap" id="admin-view" style="display:none;">
  <div class="admin-head">
    <h2>👑 لوحة تحكم CRWN</h2>
    <button class="back-btn" onclick="logout()">تسجيل خروج</button>
  </div>

  <div class="stat-row" id="stat-row"></div>

  <div class="tabs">
    <button class="tab active" data-tab="orders" onclick="switchTab('orders')">الطلبات</button>
    <button class="tab" data-tab="products" onclick="switchTab('products')">المنتجات</button>
    <button class="tab" data-tab="settings" onclick="switchTab('settings')">الإعدادات</button>
  </div>

  <div id="tab-orders"></div>
  <div id="tab-products" style="display:none;"></div>
  <div id="tab-settings" style="display:none;"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
